repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types_or: [markdown, json]

      - id: check-json

      - id: mixed-line-ending
        args: ["--fix=lf"]
        types_or: [markdown, json]

      - id: fix-byte-order-marker
        types_or: [markdown, json]

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.5.0
    hooks:
      - id: tombi-lint
        args: ["--offline"]
      - id: tombi-format

  - repo: local
    hooks:
      - id: sync-baseline
        name: sync output-style doctrine cascade
        entry: python3 scripts/sync-baseline.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-plugin-surfaces
        name: check plugin tree, manifests, and registries
        entry: node scripts/check-plugin-surfaces.mjs
        language: system
        pass_filenames: false
        always_run: true

      - id: render-plugin-surfaces
        name: check generated plugin surfaces match the catalog
        entry: node scripts/render-plugin-surfaces.mjs --check
        language: system
        pass_filenames: false
        always_run: true

      - id: check-skill-routes
        name: check skill routes and manifest identity
        entry: node scripts/check-skill-routes.mjs
        language: system
        pass_filenames: false
        always_run: true

      - id: check-voice
        name: check authored prose against the voice contract
        entry: python3 scripts/check-voice.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-voice-self-test
        name: check the voice gate against its own fixtures
        entry: python3 scripts/check-voice.py --self-test
        language: system
        pass_filenames: false
        always_run: true

      - id: check-skill-frontmatter-self-test
        name: check the frontmatter gate against its own fixtures
        entry: python3 scripts/check-skill-frontmatter.py --self-test
        language: system
        pass_filenames: false
        always_run: true

      - id: check-skill-routes-self-test
        name: check the pointer-target gate catches a planted dangling pointer
        entry: node scripts/check-skill-routes.mjs --self-test
        language: system
        pass_filenames: false
        always_run: true

      - id: render-skill-manifests
        name: check skill manifests match SKILL.md frontmatter
        entry: node scripts/render-skill-manifests.mjs --check
        language: system
        pass_filenames: false
        always_run: true
      - id: sync-knowledge-copies
        name: check generated skill files match canonical sources
        entry: node scripts/sync-knowledge-copies.mjs --check
        language: system
        pass_filenames: false
        always_run: true

      - id: render-skill-index
        name: check generated skill index matches the tree
        entry: node scripts/render-skill-index.mjs --check
        language: system
        pass_filenames: false
        always_run: true

      - id: check-skill-frontmatter
        name: check SKILL.md frontmatter parses as strict YAML
        entry: python3 scripts/check-skill-frontmatter.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-carriers
        name: check external harness carriers hold the canonical doctrine
        entry: python3 scripts/check-carriers.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-carriers-self-test
        name: check the carrier gate's own fixtures still catch a planted divergence
        entry: python3 scripts/check-carriers.py --self-test
        language: system
        pass_filenames: false
        always_run: true

      - id: sync-carriers-self-test
        name: check the carrier rewriter preserves overlays and reuses the audit
        entry: python3 scripts/sync-carriers.py --self-test
        language: system
        pass_filenames: false
        always_run: true

      - id: sync-outline-skills
        name: check the flat Devin skill mirror matches the plugin tree
        entry: node scripts/sync-outline-skills.mjs --check
        language: system
        pass_filenames: false
        always_run: true

      - id: check-skill-scripts
        name: compile, syntax-check, and self-check skill scripts
        entry: python3 scripts/check-skill-scripts.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-skill-scripts-self-test
        name: check the skill-script gate flags planted defects
        entry: python3 scripts/check-skill-scripts.py --self-test
        language: system
        pass_filenames: false
        always_run: true
