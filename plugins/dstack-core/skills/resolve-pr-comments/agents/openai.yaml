interface:
  display_name: "Resolve PR Comments"
  short_description: "Use when handling GitHub PR or GitLab MR review threads, top-level comments, or review bodies on one named PR/MR in a single batch: enumerate completely, judge against current code, repair valid findings at the root, and post replies, resolutions, and pushes under explicit human approval or under the standing review grant of a watch-and-repair-pr or autowatch invocation."
